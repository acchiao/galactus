services:
  docs:
    image: galactus_local_docs
    container_name: galactus_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./galactus:/app/galactus:z
    ports:
      - "9000:9000"
    command: /start-docs
